name: CI
on:
  push:
    branches:
      - '**'
      - '!integrated/**'
      - '!stl-preview-head/**'
      - '!stl-preview-base/**'
      - '!generated'
      - '!codegen/**'
      - 'codegen/stl/**'
  pull_request:
    branches-ignore:
      - 'stl-preview-head/**'
      - 'stl-preview-base/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  GOPRIVATE: github.com/anthropics/anthropic-sdk-go/v2,github.com/anthropics/*

jobs:
  lint:
    timeout-minutes: 10
    name: lint
    # Finding the branch's PR base reads its open PRs, which needs `pull-requests: read`.
    permissions:
      contents: read
      pull-requests: read
    runs-on: ${{ github.repository == 'anthropics/anthropic-cli' && 'ubuntu-latest' || 'sdk-ubuntu-latest-16-core' }}
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-go
        with:
          app-id: ${{ vars.GO_PRIVATE_READER_APP_ID }}
          private-key: ${{ secrets.GO_PRIVATE_READER_PRIVATE_KEY }}
          go-staging-repo: ${{ vars.GO_STAGING_REPO }}

      # A branch with no Go SDK branch of its own builds against the Go SDK branch of its PR's base.
      # With more than one open PR from the branch there is no single base, so none is used.
      - name: Find the PR's base branch
        if: github.repository_owner == 'anthropics' && github.repository != 'anthropics/anthropic-cli'
        id: pr-base
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          BASE_REF="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/pulls" -f head="${GITHUB_REPOSITORY_OWNER}:${REF_NAME}" -f state=open --jq 'if length == 1 then .[0].base.ref else empty end' || true)"
          echo "ref=${BASE_REF}" >> "$GITHUB_OUTPUT"

      - name: Link staging branch
        if: github.repository_owner == 'anthropics' && github.repository != 'anthropics/anthropic-cli'
        env:
          REF_NAME: ${{ github.ref_name }}
          BASE_REF: ${{ steps.pr-base.outputs.ref }}
          GO_STAGING_REPO: ${{ vars.GO_STAGING_REPO }}
        run: |
          if ! ./scripts/link "github.com/anthropics/${GO_STAGING_REPO}/v2@${REF_NAME}" ${BASE_REF:+"github.com/anthropics/${GO_STAGING_REPO}/v2@${BASE_REF}"}; then
            echo "::warning::Could not link the Go SDK at ${REF_NAME}${BASE_REF:+ or ${BASE_REF}}, so this build uses the Go SDK version in go.mod"
          fi

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Run lints
        run: ./scripts/lint

  build:
    timeout-minutes: 15
    name: build
    permissions:
      contents: read
      pull-requests: read
    runs-on: ${{ github.repository == 'anthropics/anthropic-cli' && 'ubuntu-latest' || 'sdk-ubuntu-latest-16-core' }}
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-go
        with:
          app-id: ${{ vars.GO_PRIVATE_READER_APP_ID }}
          private-key: ${{ secrets.GO_PRIVATE_READER_PRIVATE_KEY }}
          go-staging-repo: ${{ vars.GO_STAGING_REPO }}

      # A branch with no Go SDK branch of its own builds against the Go SDK branch of its PR's base.
      # With more than one open PR from the branch there is no single base, so none is used.
      - name: Find the PR's base branch
        if: github.repository_owner == 'anthropics' && github.repository != 'anthropics/anthropic-cli'
        id: pr-base
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          BASE_REF="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/pulls" -f head="${GITHUB_REPOSITORY_OWNER}:${REF_NAME}" -f state=open --jq 'if length == 1 then .[0].base.ref else empty end' || true)"
          echo "ref=${BASE_REF}" >> "$GITHUB_OUTPUT"

      - name: Link staging branch
        if: github.repository_owner == 'anthropics' && github.repository != 'anthropics/anthropic-cli'
        env:
          REF_NAME: ${{ github.ref_name }}
          BASE_REF: ${{ steps.pr-base.outputs.ref }}
          GO_STAGING_REPO: ${{ vars.GO_STAGING_REPO }}
        run: |
          if ! ./scripts/link "github.com/anthropics/${GO_STAGING_REPO}/v2@${REF_NAME}" ${BASE_REF:+"github.com/anthropics/${GO_STAGING_REPO}/v2@${BASE_REF}"}; then
            echo "::warning::Could not link the Go SDK at ${REF_NAME}${BASE_REF:+ or ${BASE_REF}}, so this build uses the Go SDK version in go.mod"
          fi

      - name: Bootstrap
        run: ./scripts/bootstrap

      # Keyed by run id so every run saves a fresh cache and restores the newest one visible to its branch.
      - name: Cache Go build
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: ${{ runner.temp }}/go-build-cache
          key: ${{ runner.os }}-cli-go-build-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-cli-go-build-

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          version: "2.15.2"
          args: build --snapshot --clean --id macos --id linux --id windows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Kept apart from the default GOCACHE so setup-go's go.sum-keyed cache never picks up compile output.
          GOCACHE: ${{ runner.temp }}/go-build-cache

      # Go bumps the mtime of entries it reuses, so this keeps only what this build used and bounds the saved cache.
      - name: Prune Go build cache
        shell: bash
        env:
          GOCACHE: ${{ runner.temp }}/go-build-cache
        run: find "$GOCACHE" -mindepth 2 -maxdepth 2 -mmin +90 -exec rm -rf {} +

      - name: Upload ant-darwin-arm64
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ant-darwin-arm64
          path: dist/macos_darwin_arm64*/ant
          retention-days: 90
          if-no-files-found: ignore

      - name: Upload ant-darwin-amd64
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ant-darwin-amd64
          path: dist/macos_darwin_amd64*/ant
          retention-days: 90
          if-no-files-found: ignore

      - name: Upload ant-linux-amd64
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ant-linux-amd64
          path: dist/linux_linux_amd64*/ant
          retention-days: 90
          if-no-files-found: ignore

      - name: Upload ant-linux-arm64
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ant-linux-arm64
          path: dist/linux_linux_arm64*/ant
          retention-days: 90
          if-no-files-found: ignore

      - name: Upload ant-windows-amd64
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ant-windows-amd64
          path: dist/windows_windows_amd64*/ant.exe
          retention-days: 90
          if-no-files-found: ignore

      - name: Upload ant-windows-arm64
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ant-windows-arm64
          path: dist/windows_windows_arm64*/ant.exe
          retention-days: 90
          if-no-files-found: ignore

  test:
    timeout-minutes: 20
    name: test
    permissions:
      contents: read
      pull-requests: read
    runs-on: ${{ github.repository == 'anthropics/anthropic-cli' && 'ubuntu-latest' || 'sdk-ubuntu-latest-16-core' }}
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-go
        with:
          app-id: ${{ vars.GO_PRIVATE_READER_APP_ID }}
          private-key: ${{ secrets.GO_PRIVATE_READER_PRIVATE_KEY }}
          go-staging-repo: ${{ vars.GO_STAGING_REPO }}

      # A branch with no Go SDK branch of its own builds against the Go SDK branch of its PR's base.
      # With more than one open PR from the branch there is no single base, so none is used.
      - name: Find the PR's base branch
        if: github.repository_owner == 'anthropics' && github.repository != 'anthropics/anthropic-cli'
        id: pr-base
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          BASE_REF="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/pulls" -f head="${GITHUB_REPOSITORY_OWNER}:${REF_NAME}" -f state=open --jq 'if length == 1 then .[0].base.ref else empty end' || true)"
          echo "ref=${BASE_REF}" >> "$GITHUB_OUTPUT"

      - name: Link staging branch
        if: github.repository_owner == 'anthropics' && github.repository != 'anthropics/anthropic-cli'
        env:
          REF_NAME: ${{ github.ref_name }}
          BASE_REF: ${{ steps.pr-base.outputs.ref }}
          GO_STAGING_REPO: ${{ vars.GO_STAGING_REPO }}
        run: |
          if ! ./scripts/link "github.com/anthropics/${GO_STAGING_REPO}/v2@${REF_NAME}" ${BASE_REF:+"github.com/anthropics/${GO_STAGING_REPO}/v2@${BASE_REF}"}; then
            echo "::warning::Could not link the Go SDK at ${REF_NAME}${BASE_REF:+ or ${BASE_REF}}, so this build uses the Go SDK version in go.mod"
          fi

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Run tests
        run: ./scripts/test
